name: Build subscriptions (local)

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Commit SHA or ref to build"
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # New runs replace older checks so the latest configuration starts immediately.
  cancel-in-progress: true

jobs:
  build:
    runs-on:
      - self-hosted
      - Windows
      - X64
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref || github.sha }}

      - name: Check Python version
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $candidates = @()
          $bundledPython = $null
          $runtimeArchive = Get-ChildItem -Path (Get-Location) -Filter 'python-*-runtime.zip' -File -Recurse -ErrorAction SilentlyContinue |
            Sort-Object Name -Descending |
            Select-Object -First 1
          if ($runtimeArchive) {
            $runtimeDir = Join-Path (Get-Location) '.runtime\python'
            New-Item -ItemType Directory -Path $runtimeDir -Force | Out-Null
            Add-Type -AssemblyName System.IO.Compression.FileSystem
            [System.IO.Compression.ZipFile]::ExtractToDirectory($runtimeArchive.FullName, $runtimeDir)
            $bundledPython = Get-ChildItem -LiteralPath $runtimeDir -Filter 'python.exe' -File -Recurse |
              Select-Object -ExpandProperty FullName -First 1
            if ($bundledPython) {
              $candidates += $bundledPython
            }
          }
          $launcher = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($launcher) {
            try {
              $launcherOutput = & $launcher.Source -3 -c "import sys; print(sys.executable)" 2>$null
              if ($LASTEXITCODE -eq 0 -and $launcherOutput) {
                $candidate = ($launcherOutput | Select-Object -Last 1).Trim()
                if ($candidate -and (Test-Path -LiteralPath $candidate)) {
                  $candidates += $candidate
                }
              }
            } catch {
              Write-Host "Python launcher is present but unavailable for this runner account."
            }
          }
          $python = Get-Command python.exe -ErrorAction SilentlyContinue
          if ($python) {
            $candidates += $python.Source
          }
          $searchPaths = @(
            (Join-Path $env:ProgramFiles 'Python*\python.exe'),
            (Join-Path ${env:ProgramFiles(x86)} 'Python*\python.exe')
          )
          $profiles = Get-CimInstance Win32_UserProfile -ErrorAction SilentlyContinue |
            Where-Object { $_.LocalPath } |
            Select-Object -ExpandProperty LocalPath
          foreach ($profile in $profiles) {
            $searchPaths += Join-Path $profile 'AppData\Local\Programs\Python\Python*\python.exe'
          }
          foreach ($searchPath in $searchPaths) {
            $candidates += Get-ChildItem -Path $searchPath -File -ErrorAction SilentlyContinue | Select-Object -ExpandProperty FullName
          }
          $valid = foreach ($candidate in ($candidates | Sort-Object -Unique)) {
            try {
              $versionText = (& $candidate -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')" 2>$null).Trim()
              if ($LASTEXITCODE -eq 0 -and [version]$versionText -ge [version]'3.11') {
                [pscustomobject]@{ Path = $candidate; Version = [version]$versionText }
              }
            } catch {
              Write-Host "Ignoring unusable Python candidate: $candidate"
            }
          }
          $selected = $null
          if ($bundledPython) {
            $selected = $valid | Where-Object { $_.Path -eq $bundledPython } | Select-Object -First 1
          }
          if (-not $selected) {
            $selected = $valid | Sort-Object Version -Descending | Select-Object -First 1
          }
          if (-not $selected) {
            throw "No usable Python 3.11 or newer installation was found on the self-hosted runner."
          }
          $pythonExe = $selected.Path
          $version = $selected.Version
          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          "PYTHON_BUNDLED=$(if ($bundledPython -and $pythonExe -eq $bundledPython) { '1' } else { '0' })" |
            Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Python $version at $pythonExe"

      - name: Install project
        run: |
          if ($env:PYTHON_BUNDLED -eq '1') {
            & $env:PYTHON_EXE -c "import yaml, requests, subbench; print('Using bundled offline Python dependencies')"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } else {
            & $env:PYTHON_EXE -m pip install --upgrade pip
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $env:PYTHON_EXE -m pip install .
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Install Mihomo
        run: |
          $destination = Join-Path (Get-Location) '.bin\mihomo.exe'
          New-Item -ItemType Directory -Path '.bin' -Force | Out-Null
          $existingMihomo = Get-Command mihomo.exe -ErrorAction SilentlyContinue | Select-Object -ExpandProperty Source -First 1
          if (-not $existingMihomo) {
            $existingMihomo = Get-ChildItem -Path (Get-Location) -Filter 'mihomo.exe' -File -Recurse -ErrorAction SilentlyContinue |
              Where-Object { $_.FullName -ne $destination } |
              Select-Object -ExpandProperty FullName -First 1
          }
          if ($existingMihomo) {
            Copy-Item -LiteralPath $existingMihomo -Destination $destination -Force
            Write-Host "Using bundled Mihomo: $existingMihomo"
          } else {
            & $env:PYTHON_EXE scripts/install_mihomo.py --output $destination
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Build subscriptions
        env:
          SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          ALIYUN_FC_ENABLED: "0"
          MAX_NODES: "0"
          MAX_OUTPUT_NODES: "0"
          TCP_PREFILTER_ENABLED: "1"
          TCP_CONNECT_TIMEOUT_SECONDS: "3"
          TCP_CONNECT_ATTEMPTS: "2"
          TCP_PREFILTER_WORKERS: "64"
          ALIYUN_FC_TIMEOUT_SECONDS: "10"
          # Limit Alibaba FC checks to ten concurrent requests.
          ALIYUN_FC_WORKERS: "10"
          ALIYUN_FC_INTERVAL_SECONDS: "0.2"
          ALIYUN_FC_JITTER_SECONDS: "0.1"
          ALIYUN_FC_MAX_CONSECUTIVE_ERRORS: "3"
          MAX_LATENCY_MS: "3000"
          LATENCY_TEST_ATTEMPTS: "2"
          MIN_SPEED_MBPS: "0.1"
          GEOIP_TEST_URLS: "https://www.cloudflare.com/cdn-cgi/trace,https://api.country.is/"
          GEOIP_WORKERS: "24"
          # Set to "1" to enable download speed testing and MIN_SPEED_MBPS filtering.
          SPEED_TEST_ENABLED: "0"
          SPEED_TEST_LIMIT: "0"
          SPEED_TEST_BYTES: "1000000"
          SPEED_TIMEOUT_SECONDS: "8"
          BENCHMARK_WORKERS: "24"
        run: |
          & $env:PYTHON_EXE -m subbench run --mihomo .bin/mihomo.exe --output public --workdir .work
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload subscription output
        uses: actions/upload-artifact@v7
        with:
          name: subscription-output
          path: public
          if-no-files-found: error

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Download subscription output
        uses: actions/download-artifact@v8
        with:
          name: subscription-output
          path: public

      - name: Package Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
