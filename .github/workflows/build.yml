name: Build subscriptions

on:
  workflow_dispatch:
  schedule:
    # 08:00 and 20:00 Asia/Shanghai (UTC+8)
    - cron: "0 0,12 * * *"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "pyproject.toml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install project
        run: python -m pip install --upgrade pip && python -m pip install .

      - name: Install Mihomo
        run: python scripts/install_mihomo.py --output .bin/mihomo

      - name: Build subscriptions
        env:
          SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
          MAX_NODES: "0"
          MAX_OUTPUT_NODES: "0"
          TCP_PREFILTER_ENABLED: "1"
          TCP_CONNECT_TIMEOUT_SECONDS: "3"
          TCP_CONNECT_ATTEMPTS: "2"
          TCP_PREFILTER_WORKERS: "64"
          MAX_LATENCY_MS: "3000"
          LATENCY_TEST_ATTEMPTS: "2"
          MIN_SPEED_MBPS: "0.1"
          GEOIP_TEST_URLS: "https://www.cloudflare.com/cdn-cgi/trace,https://api.country.is/"
          GEOIP_WORKERS: "24"
          # Set to "1" to enable download speed testing and MIN_SPEED_MBPS filtering.
          SPEED_TEST_ENABLED: "0"
          SPEED_TEST_LIMIT: "0"
          SPEED_TEST_BYTES: "1000000"
          SPEED_TIMEOUT_SECONDS: "8"
          BENCHMARK_WORKERS: "24"
        run: subbench run --mihomo .bin/mihomo --output public --workdir .work

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
