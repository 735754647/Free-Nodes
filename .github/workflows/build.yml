name: Build subscriptions (local)

on:
  workflow_dispatch:
  schedule:
    # 08:30 and 17:00 Asia/Shanghai (UTC+8)
    - cron: "30 0 * * *"
    - cron: "0 9 * * *"
  push:
    branches: [main]
    paths:
      - "config/**"
      - "src/**"
      - "scripts/**"
      - ".github/workflows/build.yml"
      - "pyproject.toml"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # New runs replace older checks so the latest configuration starts immediately.
  cancel-in-progress: true

jobs:
  build:
    runs-on:
      - self-hosted
      - Windows
      - X64
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -File {0}
    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Check Python version
        shell: powershell -ExecutionPolicy Bypass -File {0}
        run: |
          $pythonExe = $null
          $launcher = Get-Command py.exe -ErrorAction SilentlyContinue
          if ($launcher) {
            $candidate = (& $launcher.Source -3 -c "import sys; print(sys.executable)" 2>$null | Select-Object -Last 1).Trim()
            if ($candidate -and (Test-Path -LiteralPath $candidate)) {
              $pythonExe = $candidate
            }
          }
          if (-not $pythonExe) {
            $python = Get-Command python.exe -ErrorAction SilentlyContinue
            if ($python) {
              $pythonExe = $python.Source
            }
          }
          if (-not $pythonExe) {
            throw "No Python 3 installation was found on the self-hosted runner."
          }
          $version = (& $pythonExe -c "import sys; print(f'{sys.version_info.major}.{sys.version_info.minor}')").Trim()
          if ([version]$version -lt [version]'3.11') {
            throw "Python $version is too old; this project requires Python 3.11 or newer."
          }
          "PYTHON_EXE=$pythonExe" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append
          Write-Host "Using Python $version at $pythonExe"

      - name: Install project
        run: |
          & $env:PYTHON_EXE -m pip install --upgrade pip
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          & $env:PYTHON_EXE -m pip install .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Install Mihomo
        run: |
          & $env:PYTHON_EXE scripts/install_mihomo.py --output .bin/mihomo.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build subscriptions
        env:
          SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          ALIYUN_FC_ENABLED: "0"
          MAX_NODES: "0"
          MAX_OUTPUT_NODES: "0"
          TCP_PREFILTER_ENABLED: "1"
          TCP_CONNECT_TIMEOUT_SECONDS: "3"
          TCP_CONNECT_ATTEMPTS: "2"
          TCP_PREFILTER_WORKERS: "64"
          ALIYUN_FC_TIMEOUT_SECONDS: "10"
          # Limit Alibaba FC checks to ten concurrent requests.
          ALIYUN_FC_WORKERS: "10"
          ALIYUN_FC_INTERVAL_SECONDS: "0.2"
          ALIYUN_FC_JITTER_SECONDS: "0.1"
          ALIYUN_FC_MAX_CONSECUTIVE_ERRORS: "3"
          MAX_LATENCY_MS: "3000"
          LATENCY_TEST_ATTEMPTS: "2"
          MIN_SPEED_MBPS: "0.1"
          GEOIP_TEST_URLS: "https://www.cloudflare.com/cdn-cgi/trace,https://api.country.is/"
          GEOIP_WORKERS: "24"
          # Set to "1" to enable download speed testing and MIN_SPEED_MBPS filtering.
          SPEED_TEST_ENABLED: "0"
          SPEED_TEST_LIMIT: "0"
          SPEED_TEST_BYTES: "1000000"
          SPEED_TIMEOUT_SECONDS: "8"
          BENCHMARK_WORKERS: "24"
        run: |
          & $env:PYTHON_EXE -m subbench run --mihomo .bin/mihomo.exe --output public --workdir .work
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
