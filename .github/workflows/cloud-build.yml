name: Build subscriptions (cloud fallback)

on:
  workflow_dispatch:
    inputs:
      checkout_ref:
        description: "Commit SHA or ref to build"
        required: false
        type: string
        default: main
      source_run_id:
        description: "Local run that caused the fallback"
        required: false
        type: string
        default: manual
      reason:
        description: "Why the cloud fallback was started"
        required: false
        type: string
        default: manual

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.checkout_ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Check Python version
        shell: bash
        run: |
          python - <<'PY'
          import sys
          if sys.version_info < (3, 11):
              raise SystemExit("Python 3.11 or newer is required")
          print(f"Using Python {sys.version_info.major}.{sys.version_info.minor}")
          PY

      - name: Install project
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install .

      - name: Install Mihomo
        shell: bash
        run: python scripts/install_mihomo.py --output .bin/mihomo

      - name: Build subscriptions
        shell: bash
        env:
          SOURCE_URLS: ${{ secrets.SOURCE_URLS }}
          PYTHONUTF8: "1"
          PYTHONIOENCODING: "utf-8"
          ALIYUN_FC_ENABLED: "0"
          MAX_NODES: "0"
          MAX_OUTPUT_NODES: "0"
          TCP_PREFILTER_ENABLED: "1"
          TCP_CONNECT_TIMEOUT_SECONDS: "3"
          TCP_CONNECT_ATTEMPTS: "2"
          TCP_PREFILTER_WORKERS: "64"
          ALIYUN_FC_TIMEOUT_SECONDS: "10"
          ALIYUN_FC_WORKERS: "10"
          ALIYUN_FC_INTERVAL_SECONDS: "0.2"
          ALIYUN_FC_JITTER_SECONDS: "0.1"
          ALIYUN_FC_MAX_CONSECUTIVE_ERRORS: "3"
          MAX_LATENCY_MS: "3000"
          LATENCY_TEST_ATTEMPTS: "2"
          MIN_SPEED_MBPS: "0.1"
          GEOIP_TEST_URLS: "https://www.cloudflare.com/cdn-cgi/trace,https://api.country.is/"
          GEOIP_WORKERS: "24"
          SPEED_TEST_ENABLED: "0"
          SPEED_TEST_LIMIT: "0"
          SPEED_TEST_BYTES: "1000000"
          SPEED_TIMEOUT_SECONDS: "8"
          BENCHMARK_WORKERS: "24"
        run: subbench run --mihomo .bin/mihomo --output public --workdir .work

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
